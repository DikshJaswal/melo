<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="70%" stop-color="#090a0f" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>

    <!-- Sky Blue to Ice White Aurora Gradient -->
    <linearGradient id="meloSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="glowAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Metallic Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="4" />

  <!-- Ambient Sky Blue Glow behind the icon -->
  <circle cx="256" cy="256" r="140" fill="#0284c7" opacity="0.25" filter="url(#softGlow)" />

  <!-- Outer Vinyl Soundwave Ring (Subtle) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="3" stroke-dasharray="8 12" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#7dd3fc" stroke-opacity="0.15" stroke-width="2" />

  <!-- Dynamic Centerpiece: Stylized Modern Soundwave 'M' Emblem -->
  <!-- Left Pillar -->
  <rect x="136" y="196" width="36" height="120" rx="18" fill="url(#meloSky)" />
  
  <!-- Left-to-Center Diagonal Curve -->
  <path d="M 172 214 C 172 214, 214 286, 256 286 C 298 286, 340 214, 340 214" fill="none" stroke="url(#glowAccent)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right Pillar -->
  <rect x="340" y="196" width="36" height="120" rx="18" fill="url(#meloSky)" />

  <!-- Center Floating Sonic Frequency Core (White/Sky Star) -->
  <circle cx="256" cy="180" r="18" fill="#ffffff" filter="url(#softGlow)" />
  <circle cx="256" cy="180" r="9" fill="#38bdf8" />

  <!-- Pulse Soundwave Bars flanking the M -->
  <rect x="92" y="226" width="20" height="60" rx="10" fill="#38bdf8" opacity="0.6" />
  <rect x="400" y="226" width="20" height="60" rx="10" fill="#38bdf8" opacity="0.6" />
</svg>